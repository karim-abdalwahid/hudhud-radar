[project]
name = "hudhud-radar"
version = "1.0.0"
description = "Autonomous AI Social Media Growth Engine for Instagram & Facebook"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "httpx>=0.27.0",
    "supabase>=2.8.0",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.9",
    "pypdf>=4.3.0",
]

[tool.vercel]
entrypoint = "src/main.py:app"
